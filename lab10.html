<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 10</title>
</head>
<body>
    <script>
        
let total;
let message = "Enter your restaurant bill amount:";

do {
    total = prompt(message);

    if (total === "" || total == 0) {
        message = "Enter an amount greater than zero:";
    } else if (total < 0) {
        message = "Negative amounts are invalid, enter a positive value:";
    } else if (isNaN(total)) {
        message = "Invalid input, enter a valid number:";
    }

} while (total === "" || total <= 0 || isNaN(total));

let tip = total * 0.10;

let result = `For a total of $${total}, the tip should be $${tip}.`;

console.log(result);
document.write(result);

    </script>
    
</body>
</html>
