<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts </title>

    <style>
       body {
          background-color: #f0f2f5;
          font-family: Helvetica, Arial, sans-serif;
       }

       form {
          min-height: 180px;
       }

       article, form {
          background-color: #ffffff;
          border-radius: 8px;
          box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
          padding: 12px 16px;
          margin-bottom: 16px;
          max-width: 680px;
          margin-left: auto;
          margin-right: auto;
       }

       h2 {
          color: #050505;
          font-size: 0.9375rem;
          font-weight: 600;
          margin: 0 0 4px 0;
       }

       p {
          color: #050505;
          font-size: 0.9375rem;
          line-height: 1.3333;
          margin: 8px 0 0 0;
       }
    </style>
</head>

<body>
<h1> Welcome to my Posts page! </h1>

    <form action="#">

        <label for="userID">Select User:</label>
        <select id="userID">
            <option value="">--Please choose an option--</option>
            <option value="1">User 1</option>
            <option value="2">User 2</option>
            <option value="3">User 3</option>
            <option value="4">User 4</option>
            <option value="5">User 5</option>
            <option value="6">User 6</option>
            <option value="7">User 7</option>
        </select>

        <button type="button" id="filterBtn">Filter</button>

        <br><br>

        <label for="displayUserID">Enter User ID:</label>
        <input type="number" id="displayUserID" min="1" max="10">

        <button type="button" id="displayUserBtn">Display User Posts</button>

        <br><br>

        <label for="postID">Enter Post ID:</label>
        <input type="number" id="postID" min="1" max="100">

        <button type="button" id="findBtn">Find</button>

    </form>

    <script>
        let info = [];
        fetch("https://jsonplaceholder.typicode.com/posts")
        .then(response => response.json())
        .then(data => {
        info = data
        console.table(info);
        
        for (let i = 0; i < info.length; i++){
            let article = document.createElement("article");
            let p = document.createElement("p");
            let h2 = document.createElement("h2");
            h2.textContent = data[i].title;
            p.textContent = data[i].body;
            article.appendChild(h2)
            article.appendChild(p)

            let ids = document.createElement("p");
            ids.textContent = `User ID: ${info[i].userId} | Post ID: ${info[i].id}`;
            article.appendChild(ids);

            document.body.appendChild(article);
            }
        });

        let Dropdown = document.getElementById("userID");
        let filterbttn = document.getElementById("filterBtn");
        filterbttn.addEventListener("click", function() {
        let selectedUser = Dropdown.value;
        let filteredPosts = info.filter(function(post) {
            return post.userId == selectedUser;
            });

            console.table(filteredPosts);

       
        document.querySelectorAll("article").forEach(function(article) {
            article.remove();
        });

        for (let i = 0; i < filteredPosts.length; i++) {
            let article = document.createElement("article");
            let p = document.createElement("p");
            let h2 = document.createElement("h2");

            h2.textContent = filteredPosts[i].title;
            p.textContent = filteredPosts[i].body;

            article.appendChild(h2);
            article.appendChild(p);

            let ids = document.createElement("p");
            ids.textContent = `User ID: ${filteredPosts[i].userId} | Post ID: ${filteredPosts[i].id}`;

            article.appendChild(ids);
            document.body.appendChild(article);
        }
    });

        let userInput = document.getElementById("displayUserID");
        let displayButton = document.getElementById("displayUserBtn");

         displayButton.addEventListener("click", function() {
        let userID = Number(userInput.value);

        document.querySelectorAll("article").forEach(function(article) {
            article.remove();
        });

        for (let i = 0; i < info.length; i++) {
            if (info[i].userId === userID) {
                let article = document.createElement("article");
                let p = document.createElement("p");
                let h2 = document.createElement("h2");

                h2.textContent = info[i].title;
                p.textContent = info[i].body;

                article.appendChild(h2);
                article.appendChild(p);

                let ids = document.createElement("p");
                ids.textContent = `User ID: ${info[i].userId} | Post ID: ${info[i].id}`;

                article.appendChild(ids);
                document.body.appendChild(article);
                }
            }
        });

        
        let postInput = document.getElementById("postID");
        let findButton = document.getElementById("findBtn");

        findButton.addEventListener("click", function() {
        let postID = Number(postInput.value);
        let found = false;

        document.querySelectorAll("article").forEach(function(article) {
            article.remove();
        });

        for (let i = 0; i < info.length; i++) {
            if (info[i].id === postID) {
                let article = document.createElement("article");
                let p = document.createElement("p");
                let h2 = document.createElement("h2");

                h2.textContent = info[i].title;
                p.textContent = info[i].body;

                article.appendChild(h2);
                article.appendChild(p);

                let ids = document.createElement("p");
                ids.textContent = `User ID: ${info[i].userId} | Post ID: ${info[i].id}`;

                article.appendChild(ids);
                document.body.appendChild(article);

                found = true;
            }
        }

        if (found === false) {
            let article = document.createElement("article");
            article.textContent = "No post found.";
            document.body.appendChild(article);
        }});
    </script>

</body>
</html>
