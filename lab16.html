<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 16</title>
    <style>
        form{display:flex;
        flex-direction: column;
    }
    .rule {
    color: red;
    }
    .valid {
    color: green;
    }
    
    </style>
</head>
<body>
    <form action="#">
        <label for ="name">Name:</label>
        <input type ="text" id ="name" placeholder="Enter your name" required>
        <label for ="emailadd">Email:</label>
        <input type ="email" id ="emailadd" placeholder="Enter your email" required>
        <label for ="password">Password:</label>
        <input type ="password" id ="password" placeholder="Enter your password" required>    
        
<div  class="rules" id="password-rules" hidden>
    <div id="rule-length" class="rule">✖ At least 6 characters</div>
    <div id="rule-special" class="rule">✖ Must include a special character (!@#$...)</div>
    <div id="rule-uppercase" class="rule">✖ Must include an uppercase letter (A-Z)</div>
</div>       
<button id= "btn">Submit</button>
    </form>

    <script>
        const button = document.getElementById("btn");
        const form = button.closest("form");
        form.addEventListener("submit", (event) => {
            event.preventDefault();
            const name = document.getElementById("name").value;
            const email = document.getElementById("emailadd").value;
            const password = document.getElementById("password").value;

            if (name == "" || email == "" || password == "" || password.length < 6 || !/[!@#$%^&*(),.?":{}|<>]/.test(password) || !/[A-Z]/.test(password)) {
                console.log("invalid");
                alert("Invalid");
            } else {
                console.log("valid");
                alert("Success");}
        })


        const passwordInput = document.getElementById("password");

        passwordInput.addEventListener("input", () => {
        const password = passwordInput.value;

        const length = password.length >= 6;
        const special = /[!@#$%^&*(),.?":{}|<>]/.test(password);
        const uppercase = /[A-Z]/.test(password);

        const rules = document.getElementById("password-rules");
        rules.hidden = false;

        document.getElementById("rule-length").classList.toggle("valid", length);
        document.getElementById("rule-special").classList.toggle("valid", special);
        document.getElementById("rule-uppercase").classList.toggle("valid", uppercase);
        });

    </script>

    
    
</body>
</html>
